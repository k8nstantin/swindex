[package]
name = "swindex"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Hierarchical small-world property-graph index — Leiden communities + hub-aware navigation + incremental maintenance."
repository = "https://github.com/k8nstantin/swindex"
license-file = "LICENSE"
readme = "README.md"
categories = ["data-structures", "algorithms", "database"]
keywords = ["graph", "index", "leiden", "small-world", "hnsw"]

[dependencies]
fjall = "2"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
criterion = "0.5"
serde_json = "1"
tempfile = "3"

# Examples reuse a few dev-deps (tempfile in particular) so the
# quickstart can build cleanly via `cargo build --examples`.
[[example]]
name = "quickstart"
path = "examples/quickstart.rs"

[[bench]]
name = "scaling"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
